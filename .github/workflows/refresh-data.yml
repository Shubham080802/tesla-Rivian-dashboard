# Daily refresh of the sources that publish new data (SEC, FRED, Wikimedia, the U.S. station locator).
# BYD's monthly and annual figures are typed in by hand (see docs/TODO.md). If any check fails, nothing is
# committed and the site keeps showing the last good data. A commit to main makes Vercel redeploy automatically.
name: Refresh data

on:
  schedule:
    - cron: "17 6 * * *"        # every day, 06:17 UTC
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild the data
        env:
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/build_ev_data.py
          python scripts/build_versus_data.py
          python scripts/build_drivers.py
          python scripts/export_tableau.py
          python scripts/check_data.py || true      # writes checks.json; the strict run below decides
          python scripts/export_tableau.py
      - name: Check the refreshed data
        run: python scripts/check_data.py
      - name: Commit if the sources changed
        run: |
          # the "built" date changes every run, so only publish when a source file actually changed
          if git diff --quiet -- data/external; then
            echo "No new source data today; nothing to publish."
            git checkout -- web tableau
            exit 0
          fi
          git config user.name "data-refresh-bot"
          git config user.email "data-refresh-bot@users.noreply.github.com"
          git add data/external web tableau
          git commit -m "data: scheduled refresh ($(date -u +%F))"
          git push
